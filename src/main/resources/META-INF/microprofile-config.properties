# MicroProfile Config Configuration for Helix Cortex
helix.cortex.executor.type=VIRTUAL_THREADS
jwt.secret=helix-cortex-default-super-secret-key-32-bytes-minimum

# Redis L4 Distributed Cache Configuration
helix.cortex.cache.redis.host=localhost
helix.cortex.cache.redis.port=6379
helix.cortex.cache.redis.timeout=2000
helix.cortex.cache.redis.ttl-seconds=86400
helix.cortex.cache.redis.fallback-enabled=true
helix.cortex.cache.redis.pool.max-total=32

