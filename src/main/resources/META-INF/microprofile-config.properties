# MicroProfile Config Configuration for Helix Cortex
helix.cortex.executor.type=VIRTUAL_THREADS
jwt.secret=helix-cortex-default-super-secret-key-32-bytes-minimum

# Redis L4 Distributed Cache Configuration
helix.cortex.cache.redis.host=localhost
helix.cortex.cache.redis.port=6379
helix.cortex.cache.redis.timeout=2000
helix.cortex.cache.redis.ttl-seconds=86400
helix.cortex.cache.redis.fallback-enabled=true
helix.cortex.cache.redis.pool.max-total=32

# Kafka Streaming Ingestion Gateway Configuration
helix.cortex.kafka.bootstrap-servers=localhost:9092
helix.cortex.kafka.group-id=helix-cortex-stream-group
helix.cortex.kafka.input-topic=rules.input
helix.cortex.kafka.results-topic=rules.results
helix.cortex.kafka.batch-size=25
helix.cortex.kafka.flush-interval-ms=50
helix.cortex.kafka.consumer.auto-offset-reset=earliest
helix.cortex.kafka.enabled=true

# ONNX Model Registry Configuration
helix.onnx.model.store.path=/var/helix/models
helix.onnx.model.max-size-bytes=26214400
helix.models.redis.topic=helix:models:activate

